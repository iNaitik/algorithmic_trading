services:
  - type: web
    name: algo-trading-bot
    env: python
    region: singapore
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
